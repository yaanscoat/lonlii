<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <script src="/assets/js/compat.js"></script>
    <title>lonlii | ai</title>
    <link rel="shortcut icon" href="/assets/img/lonelii.png" type="image/png" id="tabIcon">
    <link rel="stylesheet" href="/assets/css/colors.css" id="css-theme-link">
    <script src="/assets/js/colors.js"></script>
    <link rel="stylesheet" href="/assets/css/font.css">
    <link rel="stylesheet" href="/assets/icons/remixicon/remixicon.css">
    <link rel="stylesheet" href="/assets/css/glass.css">
    <link rel="stylesheet" href="/assets/css/ai.css">
    <!-- the proxy, used only when this network blocks openrouter -->
    <script src="/proxy/uv/uv.bundle.js"></script>
    <script src="/proxy/uv/uv.config.js"></script>
    <script src="/proxy/bare-mux/index.js"></script>
    <script src="/assets/js/transport.js"></script>
    <script src="/assets/js/proxy.js"></script>
    <script>
        // inside the main site the page is see-through so the background shows behind it
        if (window.self !== window.top) document.documentElement.classList.add("embedded")
    </script>
    <link rel="stylesheet" href="/assets/css/compat.css">
</head>

<body>
    <div class="ai-app">
        <!-- left: your chats -->
        <aside class="ai-side glass" id="side">
            <button class="new-chat" id="newChat" type="button"><i class="ri-chat-new-line"></i> New chat</button>
            <p class="side-label">Chats</p>
            <div class="chat-list" id="chatList"></div>
            <p class="side-note">Runs on free models from OpenRouter. Your chats are only saved in this browser.</p>
        </aside>
        <div class="side-scrim" id="sideScrim"></div>

        <!-- right: the conversation -->
        <main class="ai-main">
            <header class="ai-top">
                <button class="round side-toggle" id="sideToggle" type="button" title="Chats"><i class="ri-menu-line"></i></button>
                <label class="model-pick glass" title="Model">
                    <i class="ri-sparkling-2-line"></i>
                    <select id="modelSelect">
                        <option value="auto">Auto (best free model)</option>
                    </select>
                    <i class="ri-arrow-down-s-line"></i>
                </label>
            </header>

            <div class="thread" id="thread"></div>

            <form class="composer glass" id="composer" autocomplete="off">
                <textarea id="input" rows="1" placeholder="Ask lonlii anything" enterkeyhint="send"></textarea>
                <button class="send" id="send" type="submit" title="Send"><i class="ri-arrow-up-line"></i></button>
            </form>
            <p class="fineprint">AI can be wrong, so check anything important.</p>
        </main>
    </div>

    <script src="/assets/js/profile.js"></script>
    <script src="/assets/js/ai/markdown.js"></script>
    <script src="/assets/js/ai/openrouter.js"></script>
    <script src="/assets/js/ai/app.js"></script>
</body>

</html>
